mode:
  id: automation
  name: "Automation & Process Mapping"
  description: "Mapeia processo + ferramentas existentes + esforço pra automatizar."
vault_load:
  scopes: [wiki/concepts/, wiki/projects/, wiki/_refs/, wiki/clients/]
  exclude: [wiki/_state/, wiki/notes/, raw/]
  max_pages: 7
  rank_by: keyword_density
decompose:
  sub_query_count: [5, 7]
  required_angles: [existing-tools, custom-build-effort, integration-points, edge-cases, maintenance-cost]
  ultrathink: true
search:
  workers: 5
  sources_priority:
    - "n8n.io/workflows"
    - "make.com/templates"
    - "zapier.com/templates"
    - "github.com/*/awesome-mcp"
    - "github.com/*/n8n-*"
    - "modelcontextprotocol.io"
    - "docs.anthropic.com"
  sources_boost:
    "n8n.io": 1.4
    "modelcontextprotocol.io": 1.3
  sources_block: [pinterest.com, medium.com]
  prefer_tools: [exa, websearch]
  max_deep_reads_per_worker: 3
evaluate:
  min_coverage_to_stop: 65
  min_high_credibility_sources: 3
  mode_specific_checks:
    - rule: "pelo menos 1 existing tool concorrente identificado"
      on_fail: continue_with_competitor_queries
synthesize:
  prompt_file: synthesize-automation.md
  required_sections: [tldr, process_map, existing_tools, custom_build_effort, maintenance_cost, risks]
applied_lens:
  universal_sections: [vault_context, money_angle, next_actions]
  mode_specific_sections: [stack_shortlist]
  money_angle_dimensions: 5
document:
  output_dir: wiki/research/
  index_section: "## Research"
  log_entry_template: "research-automation | {topic} | tools_found: {tools_count}"
  frontmatter_extras:
    research_mode: automation
