mode:
  id: deep
  name: "Deep Topic Research"
  description: "Broad understanding com source rigor. Para dominar um domínio."
  default: true
vault_load:
  scopes: [wiki/concepts/, wiki/projects/, wiki/_refs/]
  exclude: [wiki/_state/, wiki/notes/, raw/]
  max_pages: 5
  rank_by: keyword_density
decompose:
  sub_query_count: [5, 7]
  required_angles: [expert, devils-advocate, comparison, historical, recent-soa]
  ultrathink: true
search:
  workers: 5
  sources_priority:
    - "arxiv.org"
    - "*.gov.br"
    - "*.edu"
    - "docs.*"
    - "*.org/docs"
    - "stackoverflow.com"
  sources_boost:
    "wikipedia.org": 1.1
  sources_block: [pinterest.com, quora.com, medium.com]
  prefer_tools: [exa, websearch]
  max_deep_reads_per_worker: 3
evaluate:
  min_coverage_to_stop: 70
  min_high_credibility_sources: 4
  mode_specific_checks: []
synthesize:
  prompt_file: synthesize-deep.md
  required_sections: [tldr, state_of_art, comparison_matrix, citations_pyramid, glossary, open_questions]
applied_lens:
  universal_sections: [vault_context, money_angle, next_actions]
  mode_specific_sections: []
  money_angle_dimensions: 5
document:
  output_dir: wiki/research/
  index_section: "## Research"
  log_entry_template: "research-deep | {topic} | sources: {high_cred_count} HIGH"
  frontmatter_extras:
    research_mode: deep
